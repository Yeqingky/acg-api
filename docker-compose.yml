services:
  acg-api:
    image: ghcr.io/yeqingky/acg-api:latest
    # 中国大陆可使用 ghcr.nju.edu.cn/yeqingky/acg-api:latest
    container_name: acg-api
    restart: always
    # 兼容 .php 旧路径时取消注释
    # command: ["-php-compat"]
    volumes:
      - ./data:/app/data:ro
    ports:
      - "127.0.0.1:8080:8080"
